version: "1.0"
id: vn-myth
name: "VN-Myth"
platform: youtube

canvas:
  width: 1920
  height: 1080
  fps: 30
  aspect_ratio: "16:9"

theme:
  remotion_theme_id: vn-myth
  style_playbook: ink-genome
  safe_zone_profile: youtube-16x9

audio:
  tts_provider: vieneu_tts
  voice: null
  speed: 1.0
  language: vi
  tail_seconds: 0.25
  lexicon: tts_lexicon.json
  mix_profile: mix_profile.json
  bgm_dir: assets/bgm

brand:
  bumper_enabled: false
  bumper_frames: 0
  bumper_video_9x16: null
  bumper_video_16x9: null
  bumper_sting: null
  characters_dir: assets/characters
  textures_dir: assets/textures

pipeline:
  default_pipeline: animated-explainer
  lane: myth-archival-diorama
  qc_gates:
    - bgm_gate

editorial_rules: editorial-rules.md

publish:
  hashtags_max: 5
  forbidden_hashtags: []
  description_template: "Narrative hook + chapter timestamps from scene_timing + cultural/historical references"
