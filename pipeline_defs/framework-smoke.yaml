# Production contract: docs/ORCHESTRATION_DOCTRINE.md is the canonical authority (v3.0 Antigravity-native; this yaml is a synced mirror).
# Stages below map the doctrine 7 required phases; human gates (human_approval_default) are enforced by lib/checkpoint.py.
# Mechanical gates/detectors: tools/qc/* (fact_whitelist_gate, source_photo_gate, editorial_language_gate, timing_relock_guard, episode_gate, mix_validator) — strict success semantics apply.
name: framework-smoke
version: "1.0"
description: Minimal pipeline manifest used to exercise the Phase 0 framework contracts.
category: custom
stability: beta
default_checkpoint_policy: guided
stages:
  - name: research
    produces:
      - research_brief
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    success_criteria:
      - Produces a schema-valid research_brief artifact
  - name: script
    required_artifacts_in:
      - research_brief
    produces:
      - script
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    success_criteria:
      - Produces a schema-valid script artifact
