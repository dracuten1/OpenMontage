identity:
  name: "Broadcast Swiss Editorial"
  category: custom
  mood: authoritative, crisp, investigative, photojournalistic, anti-AI
  pace: deliberate
  best_for: "Personal news breakdowns, Vietnamese investigative explainers, economic/policy & geopolitical analyses"

taste_profile:
  design_read: "Hybrid Full-Bleed Photojournalism (Brut / NYT Watch) × Swiss Edge-to-Edge Split (Bloomberg Businessweek / The Economist): deep Broadcast Carbon #0B0C0E masthead and lower-third cinema bands framing a crisp Swiss Gallery #F5F5F2 stage, sharp signal blocks, 12fps 35mm film grain, zero 1px bordered HTML cards."
  visual_variance: 7
  motion_intensity: 6
  information_density: 6
  palette_discipline: "Swiss Gallery #F5F5F2 and Broadcast Carbon #0B0C0E primary dual ground, Signal Red #E11D2E and Signal Yellow #FFD100 / Signal Orange #FF5500 strictly for proof points, active highlights, and data emphasis."
  layout_variation: "Alternate full-bleed photojournalism (layoutMode='full-bleed'), dark tactical EditorialMap, Economist-style pillar EditorialBarChart / EditorialLineChart, ArchivalSpotlight, FlowTimeline, and ComparisonSplit; never repeat the same archetype consecutively."
  reference_strategy: "Verify real press photographs via source_photo_gate and preview peak-frame PNGs before final compose."
  anti_patterns:
    - "sepia beige card-itis (stacked 1px bordered HTML boxes on #F4EFE6)"
    - "JetBrains Mono middot (·) badges and floating black subtitle toast boxes"
    - "dark slate/blue radial gradients with neon cyan or crimson glows"
    - "rounded-pill glassmorphic SaaS dashboard cards"
    - "generic AI slide bullets or plain text walls"
    - "bouncy cartoon springs (damping < 16)"
  quality_gates:
    - "Frame t=0 of Scene 1 functions as an authentic edge-to-edge Swiss/broadcast cover hook with high legibility and zero brand-bumper burn."
    - "Every number displayed on screen traces strictly to the pinned fact whitelist."

visual_language:
  color_palette:
    primary: ["#0B0C0E", "#151821"]
    accent: ["#E11D2E", "#FFD100", "#FF5500"]
    background: "#F5F5F2"
    text: "#0B0C0E"
    muted: "#52565E"
  composition: "Edge-to-edge Broadcast Carbon masthead (y 0-332) + Swiss Gallery stage (y 332-1444, Safe Zone v3.2 x 90-940) + Cinema lower-third subtitle band (y 1444-1920), or full-bleed 1080x1920 photojournalism with dark gradient scrim."
  texture: "Real 12fps 35mm silver-halide film grain textures (textures/film_grain_1..3.png), borderless dark-carbon HUD cartography, zero rounded card borders."

typography:
  headings:
    font: "Barlow Condensed"
    weight: 900
    tracking: "-0.02em"
  body:
    font: "Plus Jakarta Sans"
    weight: 600
    line_height: 1.32
  code:
    font: "Barlow Condensed"
    weight: 800
  stat_card:
    font: "Barlow Condensed"
    weight: 900
    size_multiplier: 3.2
  scale_system: "major_third"
  weight_matrix:
    title: 900
    heading: 900
    body: 600
    caption: 800

motion:
  transitions: [cut, slide-left, wipe]
  animation_style: "damped editorial snap (damping 16-22, stiffness 120-150), masked reveal, zero overshoot bounce, subtle 2.5D camera push"
  pacing_rules:
    min_scene_hold_seconds: 3.0
    max_scene_hold_seconds: 12.0
    text_card_hold_seconds: 3.5
    stat_card_hold_seconds: 3.5
    transition_duration_seconds: 0.35
  entrance: "crisp masked reveal + directional signal wipe"
  exit: "clean hard cut"

audio:
  voice_style: "direct, conversational Vietnamese editorial voice — crisp, human, grounded, never robotic hype"
  music_mood: "restrained documentary pulse, subtle acoustic/percussive tension bed"
  music_volume: 0.10
  sfx_style: "camera shutters, clean crisp transitions, felt highlighter swipes, subtle telemetry clicks (-6 to -14 dB)"
  ducking_threshold_db: -6

asset_generation:
  image_prompt_prefix: "high-contrast documentary photojournalism editorial illustration, crisp 35mm film grain, stark lighting, Swiss editorial restraint, selective signal red and yellow accents, "
  image_negative_prompt: "dark neon, cyberpunk, 3D Pixar, glossy plastic, cartoon, anime, glowing gradients, watermark, blurry text, sepia card borders"
  diagram_style: "Economist/FT precision chart on #F5F5F2 Swiss Gallery stock, 2px ink baseline, Signal Red #E11D2E lead series, tabular Barlow Condensed numerals"
  consistency_anchors:
    - "Dual ground: Swiss Gallery (#F5F5F2) stage framed by Broadcast Carbon (#0B0C0E) masthead and cinema lower-third bands"
    - "Barlow Condensed 900 Black display headlines & numbers paired with Plus Jakarta Sans / Be Vietnam Pro body"
    - "Signal Red (#E11D2E), Signal Yellow (#FFD100), and Signal Orange (#FF5500) accents; zero 1px bordered HTML card boxes"
    - "Blender 3D scene illustrations must use matte architectural maquette or dark noir studio lighting, never glossy plastic neon"

overlays:
  stat_card:
    bg: "#FFFFFF"
    border: "#0B0C0E"
    text: "#0B0C0E"
    radius: 0
    shadow: "none"
  key_term:
    bg: "#FFD100"
    text: "#0B0C0E"
    radius: 0
  code_block:
    bg: "#0B0C0E"
    text: "#FFFFFF"
    highlight: "#FFD100"
  section_title:
    bg: "#0B0C0E"
    border: "#E11D2E"
    text: "#FFFFFF"
    accent: "#E11D2E"
  stat_reveal:
    bg: "#FFFFFF"
    text: "#0B0C0E"
    accent: "#E11D2E"
  hero_title:
    bg: "#F5F5F2"
    text: "#0B0C0E"
    accent: "#E11D2E"
  provider_chip:
    bg: "#0B0C0E"
    border: "#E11D2E"
    text: "#FFFFFF"

quality_rules:
  - "Minimum contrast ratio 4.5:1 for all text on Swiss Gallery (#F5F5F2) and Broadcast Carbon (#0B0C0E) surfaces"
  - "Zero 4-sided 1px HTML card borders or floating black subtitle toast boxes"
  - "Zero neon textShadow or boxShadow glows anywhere in editorial compositions"
  - "Scene 1 frame 0 must act as a compelling edge-to-edge cover thumbnail; BrandBumper belongs strictly at the outro"
  - "All displayed numbers must trace to the closed fact whitelist; real photos require source badges"

chart_palette:
  - "#E11D2E"
  - "#0B0C0E"
  - "#FF5500"
  - "#0052FF"
  - "#0D9488"

color_rules:
  harmony_type: "split-complementary"
  contrast_validation: true
  colorblind_safe: true
